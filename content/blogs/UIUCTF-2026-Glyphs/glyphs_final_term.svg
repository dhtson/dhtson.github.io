<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="420" viewBox="0 0 1020 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff" />
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #ffffff; }
      .title { font-size: 20px; font-weight: 700; }
      .box { fill: none; stroke: #ffffff; stroke-width: 1.8; }
      .line { fill: none; stroke: #ffffff; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="510" y="30" text-anchor="middle" class="title">The check hidden at the end</text>
  <rect x="390" y="60" width="240" height="60" rx="10" class="box"/>
  <text x="510" y="90" text-anchor="middle">final term</text>
  <rect x="390" y="160" width="240" height="65" rx="10" class="box"/>
  <text x="510" y="183.5" text-anchor="middle">((((CHECKER TARGET)</text>
  <text x="510" y="201.5" text-anchor="middle">USER) nope) good)</text>
  <rect x="60" y="300" width="190" height="55" rx="10" class="box"/>
  <text x="155" y="318.5" text-anchor="middle">CHECKER</text>
  <text x="155" y="336.5" text-anchor="middle">structural equality</text>
  <rect x="290" y="300" width="190" height="55" rx="10" class="box"/>
  <text x="385" y="318.5" text-anchor="middle">TARGET</text>
  <text x="385" y="336.5" text-anchor="middle">expected tree</text>
  <rect x="520" y="300" width="190" height="55" rx="10" class="box"/>
  <text x="615" y="318.5" text-anchor="middle">USER</text>
  <text x="615" y="336.5" text-anchor="middle">argv-derived tree</text>
  <rect x="750" y="300" width="190" height="55" rx="10" class="box"/>
  <text x="845" y="318.5" text-anchor="middle">"nope" / "good"</text>
  <text x="845" y="336.5" text-anchor="middle">Church branches</text>
  <line x1="510" y1="120" x2="510" y2="160" class="line"/>
  <polyline points="510,225 510,260 155,260 155,300" class="line"/>
  <polyline points="510,225 510,260 385,260 385,300" class="line"/>
  <polyline points="510,225 510,260 615,260 615,300" class="line"/>
  <polyline points="510,225 510,260 845,260 845,300" class="line"/>
</svg>