<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff" />
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #ffffff; }
      .title { font-size: 20px; font-weight: 700; }
      .small { font-size: 12px; }
      .dim { fill: #d0d0d0; }
      .box { fill: none; stroke: #ffffff; stroke-width: 1.8; }
      .dash { fill: none; stroke: #ffffff; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .fill { fill: #ffffff; fill-opacity: 0.22; stroke: #ffffff; stroke-width: 1.4; }
      .hot { fill: #ffffff; fill-opacity: 0.5; stroke: #ffffff; stroke-width: 1.4; }
      .cell { fill: none; stroke: #ffffff; stroke-width: 1.2; }
      .line { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #ffffff; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="title">High-level solve path</text>
  <rect x="30" y="70" width="220" height="74" rx="10" class="box"/>
  <text x="140" y="103" text-anchor="middle">chall.exe, 15 MB</text>
  <text x="140" y="121" text-anchor="middle">flattened + MBA</text>
  <rect x="300" y="70" width="220" height="74" rx="10" class="box"/>
  <text x="410" y="103" text-anchor="middle">C2 handshake</text>
  <text x="410" y="121" text-anchor="middle">nonce -&gt; 32-byte digest</text>
  <rect x="570" y="70" width="230" height="74" rx="10" class="box"/>
  <text x="685" y="103" text-anchor="middle">guess the GPU record</text>
  <text x="685" y="121" text-anchor="middle">372 of 3,400 tries</text>
  <rect x="570" y="200" width="230" height="74" rx="10" class="box"/>
  <text x="685" y="233" text-anchor="middle">payload: Intel zebin</text>
  <text x="685" y="251" text-anchor="middle">466,776 bytes</text>
  <rect x="300" y="200" width="220" height="74" rx="10" class="box"/>
  <text x="410" y="233" text-anchor="middle">SPIR-V kernel k0</text>
  <text x="410" y="251" text-anchor="middle">run without a GPU</text>
  <rect x="30" y="200" width="220" height="74" rx="10" class="box"/>
  <text x="140" y="233" text-anchor="middle">4 challenge rounds</text>
  <text x="140" y="251" text-anchor="middle">answers accepted</text>
  <rect x="30" y="330" width="220" height="74" rx="10" class="box"/>
  <text x="140" y="363" text-anchor="middle">server sends 0x72</text>
  <text x="140" y="381" text-anchor="middle">client says 0x48: bye</text>
  <rect x="300" y="330" width="220" height="74" rx="10" class="box"/>
  <text x="410" y="363" text-anchor="middle">guess the reply type</text>
  <text x="410" y="381" text-anchor="middle">255 sessions</text>
  <rect x="570" y="330" width="230" height="74" rx="10" class="box"/>
  <text x="685" y="363" text-anchor="middle">0x6e -&gt; 0xbc</text>
  <text x="685" y="381" text-anchor="middle">flag in the body</text>
  <line x1="250" y1="107" x2="300" y2="107" class="line"/>
  <line x1="520" y1="107" x2="570" y2="107" class="line"/>
  <line x1="685" y1="144" x2="685" y2="200" class="line"/>
  <line x1="570" y1="237" x2="520" y2="237" class="line"/>
  <line x1="300" y1="237" x2="250" y2="237" class="line"/>
  <line x1="140" y1="274" x2="140" y2="330" class="line"/>
  <line x1="250" y1="367" x2="300" y2="367" class="line"/>
  <line x1="520" y1="367" x2="570" y2="367" class="line"/>
  <rect x="30" y="450" width="770" height="70" rx="10" class="dash"/>
  <text x="415" y="481" text-anchor="middle" class="small">guessing: GPU record, reply type  |  obfuscation: flattening, MBA, hashed APIs, decoys</text>
  <text x="415" y="499" text-anchor="middle" class="small">anti-disassembly: stripped zebin names (ocloc refuses the file)</text>
</svg>
