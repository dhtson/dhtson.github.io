<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff" />
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #ffffff; }
      .title { font-size: 20px; font-weight: 700; }
      .small { font-size: 12px; }
      .dim { fill: #d0d0d0; }
      .box { fill: none; stroke: #ffffff; stroke-width: 1.8; }
      .dash { fill: none; stroke: #ffffff; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .fill { fill: #ffffff; fill-opacity: 0.22; stroke: #ffffff; stroke-width: 1.4; }
      .hot { fill: #ffffff; fill-opacity: 0.5; stroke: #ffffff; stroke-width: 1.4; }
      .cell { fill: none; stroke: #ffffff; stroke-width: 1.2; }
      .line { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #ffffff; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="title">Each round chains on the previous answer</text>
  <rect x="30" y="70" width="200" height="60" rx="10" class="dash"/>
  <text x="130" y="105" text-anchor="middle" class="small">key' = k0(H, base key)[0:4]</text>
  <rect x="280" y="70" width="170" height="50" rx="10" class="box"/>
  <text x="365" y="100" text-anchor="middle" class="small">C_1 (from server)</text>
  <rect x="280" y="160" width="170" height="50" rx="10" class="box"/>
  <text x="365" y="190" text-anchor="middle" class="small">bswap32 each word</text>
  <rect x="335" y="240" width="60" height="40" rx="10" class="box"/>
  <text x="365" y="265" text-anchor="middle" class="small">XOR</text>
  <rect x="280" y="310" width="170" height="50" rx="10" class="box"/>
  <text x="365" y="340" text-anchor="middle" class="small">R_1 = k0(., key')</text>
  <line x1="365" y1="120" x2="365" y2="160" class="line"/>
  <line x1="365" y1="210" x2="365" y2="240" class="line"/>
  <line x1="365" y1="280" x2="365" y2="310" class="line"/>
  <polyline points="450,335 485,335 485,260 575,260" class="line"/>
  <rect x="520" y="70" width="170" height="50" rx="10" class="box"/>
  <text x="605" y="100" text-anchor="middle" class="small">C_2 (from server)</text>
  <rect x="520" y="160" width="170" height="50" rx="10" class="box"/>
  <text x="605" y="190" text-anchor="middle" class="small">bswap32 each word</text>
  <rect x="575" y="240" width="60" height="40" rx="10" class="box"/>
  <text x="605" y="265" text-anchor="middle" class="small">XOR</text>
  <rect x="520" y="310" width="170" height="50" rx="10" class="box"/>
  <text x="605" y="340" text-anchor="middle" class="small">R_2 = k0(., key')</text>
  <line x1="605" y1="120" x2="605" y2="160" class="line"/>
  <line x1="605" y1="210" x2="605" y2="240" class="line"/>
  <line x1="605" y1="280" x2="605" y2="310" class="line"/>
  <polyline points="690,335 725,335 725,260 815,260" class="line"/>
  <rect x="760" y="70" width="170" height="50" rx="10" class="box"/>
  <text x="845" y="100" text-anchor="middle" class="small">C_3 (from server)</text>
  <rect x="760" y="160" width="170" height="50" rx="10" class="box"/>
  <text x="845" y="190" text-anchor="middle" class="small">bswap32 each word</text>
  <rect x="815" y="240" width="60" height="40" rx="10" class="box"/>
  <text x="845" y="265" text-anchor="middle" class="small">XOR</text>
  <rect x="760" y="310" width="170" height="50" rx="10" class="box"/>
  <text x="845" y="340" text-anchor="middle" class="small">R_3 = k0(., key')</text>
  <line x1="845" y1="120" x2="845" y2="160" class="line"/>
  <line x1="845" y1="210" x2="845" y2="240" class="line"/>
  <line x1="845" y1="280" x2="845" y2="310" class="line"/>
  <text x="160" y="250" text-anchor="middle" class="small dim">R_0 = session IV</text>
  <line x1="200" y1="260" x2="335" y2="260" class="line"/>
  <text x="130" y="330" text-anchor="middle" class="small dim">R_r goes back as 0xe9</text>
</svg>
