  <text x="250" y="327" text-anchor="middle">rounds 5 and 6 are peeled from the</text>
  <text x="250" y="345" text-anchor="middle">ciphertext side: 4 bytes of k6 and</text>
  <text x="250" y="363" text-anchor="middle">1 byte of k5' = InvMC(k5) per row</text>
  <rect x="560" y="290" width="380" height="100" rx="10" class="dash"/>
  <text x="750" y="327" text-anchor="middle">the XOR only needs odd multiplicities,</text>
  <text x="750" y="345" text-anchor="middle">so the parity bitmap is enough:</text>
  <text x="750" y="363" text-anchor="middle">XOR_texts f(v) = XOR_{bit[v]=1} f(v)</text>
